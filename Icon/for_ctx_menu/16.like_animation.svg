<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="120" height="120">
  <style>
    .heart-beat {
      fill: #ff4757;
      transform-origin: center;
      animation: pulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    
    @keyframes pulse {
      0% {
        transform: scale(1);
        fill: #ff4757;
      }
      10% {
        transform: scale(1.2);
        fill: #ff6b81;
      }
      20% {
        transform: scale(1);
        fill: #ff4757;
      }
      30% {
        transform: scale(1.15);
        fill: #ff6b81;
      }
      40% {
        transform: scale(1);
        fill: #ff4757;
      }
      100% {
        transform: scale(1);
        fill: #ff4757;
      }
    }
    
    /* Эффект тени при биении */
    .heart-beat::before {
      content: '';
      position: absolute;
      border-radius: 50%;
      width: 100%;
      height: 100%;
      background: rgba(255, 71, 87, 0.3);
      animation: shadow-pulse 1.2s infinite;
    }
    
    @keyframes shadow-pulse {
      0% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0; }
      100% { transform: scale(1); opacity: 0.5; }
    }
  </style>
  
  <!-- Сердечко -->
  <path class="heart-beat" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
</svg>